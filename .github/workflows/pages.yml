# Build the Astro site and deploy it to GitHub Pages.
#
# MANUAL ONLY, ON PURPOSE. The only trigger is workflow_dispatch: this workflow never runs on a
# push, on a schedule, or on a merge. A deploy is a decision: no page is `measured` yet, and
# dispatching by hand is a perfectly good way to publish a site that changes a few times a month.
# Run it with `gh workflow run pages.yml` or from the Actions tab.
#
# Before the first dispatch, confirm `site` and `base` in site/astro.config.mjs match the
# repository this is running in. A wrong base path builds green and breaks every link except the
# home page's.
#
# A deploy also waits for `checks` on the same commit and refuses to run unless it passed. Two
# authors push to main; on 09/20-09/21/2026 eight red commits deployed because nothing tied the
# two workflows together.

name: pages

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight, because a half-finished deploy to Pages is
# worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks-passed:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for checks on this commit, and require success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Poll for up to 20 minutes: a deploy dispatched right after a push finds checks running.
          for i in $(seq 1 40); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/checks.yml/runs?head_sha=${{ github.sha }}&per_page=1"               --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            echo "checks on ${{ github.sha }}: ${run:-none yet}"
            case "$run" in
              "completed success") exit 0 ;;
              completed*) echo "::error::checks did not pass on this commit; fix them before deploying"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::checks did not finish within 20 minutes"; exit 1

  build:
    needs: checks-passed
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Set up Python for example downloads
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configure Pages
        # Exposes the base URL Pages will serve from. It does not override astro.config.mjs,
        # which is the source of truth for `site` and `base`.
        uses: actions/configure-pages@v5

      - name: Install the site's dependencies
        working-directory: site
        run: npm ci

      - name: Build the site
        working-directory: site
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          # astro.config.mjs sets output: 'static' with the default outDir.
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
